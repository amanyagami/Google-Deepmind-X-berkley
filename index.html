  <body>
    <style>
      html { background: #08080e; }
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; background: radial-gradient(60vmax circle at 50% 46%, rgba(232, 195, 126, 0.09), transparent 62%), #08080e; }
      .boot svg { overflow: visible; filter: drop-shadow(0 0 22px rgba(255, 180, 84, 0.35)); }
      .boot path, .boot rect { stroke-dasharray: 1; animation: bootd 1.5s cubic-bezier(.16, 1, .3, 1) both; }
      .boot .b2 { animation-delay: 0.18s; } .boot .b3 { animation-delay: 0.36s; }
      .boot .b4 { stroke-dasharray: none; animation: bootp 1.4s 0.5s ease-in-out infinite alternate both; transform-origin: 12px 12px; }
      .boot i { width: 96px; height: 1px; background: linear-gradient(90deg, transparent, #e8c37e, transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: boots 1.3s ease-in-out infinite; }
      @keyframes bootd { from { stroke-dashoffset: 1; } }
      @keyframes bootp { from { opacity: 0.25; transform: scale(0.7); } }
      @keyframes boots { from { background-position: -100% 0; } to { background-position: 200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot path, .boot rect, .boot i { animation: none !important; } }
    </style>
